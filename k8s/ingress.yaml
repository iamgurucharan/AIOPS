apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: robo-shop-workbench
  namespace: guru
  labels:
    app.kubernetes.io/name: robo-shop-workbench
  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTPS":443}]'
    alb.ingress.kubernetes.io/certificate-arn: REPLACE_WITH_ACM_CERTIFICATE_ARN
    alb.ingress.kubernetes.io/inbound-cidrs: REPLACE_WITH_YOUR_PUBLIC_IP_CIDR
    alb.ingress.kubernetes.io/healthcheck-path: /healthz
    alb.ingress.kubernetes.io/healthcheck-protocol: HTTP
    alb.ingress.kubernetes.io/success-codes: "200"
spec:
  ingressClassName: alb
  rules:
    - host: incidents.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: robo-shop-workbench
                port:
                  number: 80
